services:
  toolbox:
    build:
      context: .
      args:
        # Login user identity. 568 is TrueNAS SCALE's `apps` id; datasets there
        # are mode 770 owned by root:568, so a user outside group 568 cannot
        # read them. Baked at build time — changing it needs a rebuild.
        PUID: ${PUID:-568}
        PGID: ${PGID:-568}
    image: ghcr.io/d7eeem/toolbox-cli:latest
    container_name: toolbox
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    environment:
      # Public key authorized for the key-only sshd. Replace with your own key,
      # or mount one at /authorized_keys.
      - SSH_PUBKEY=${TOOLBOX_SSH_PUBKEY:-}
    ports:
      # SSH: shell access, and the reverse tunnel that `open` streams through.
      # Host 2222 -> container 22 (22 is often taken by the host, e.g. TrueNAS).
      - "2222:22"
    working_dir: /work
    volumes:
      # Default: your home directory, overridable with TOOLBOX_MOUNT in .env.
      - ${TOOLBOX_MOUNT:-${HOME}}:/work
      # Keep SSH host keys across recreations, so clients are not warned that
      # the host identity changed after every redeploy.
      - toolbox-ssh-keys:/etc/ssh/host_keys
      # On TrueNAS SCALE, mount the datasets you want the toolbox to reach
      # instead. Pool and dataset names are specific to your installation —
      # edit these before uncommenting, and see "Deploying on TrueNAS SCALE"
      # in README.md.
      # - /mnt/tank/media:/work/media
      # - /mnt/tank/downloads:/work/downloads

volumes:
  toolbox-ssh-keys:
